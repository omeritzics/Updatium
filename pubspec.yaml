name: updatium
description: A customizable Android app catalogue that allows you to update your apps directly from their APK sources.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 26.5.0+2605261

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.6
  flutter_fgbg: ^0.8.0
  flutter_local_notifications: ^22.0.0
  provider: ^6.1.5+1
  http: ^1.6.0
  material_color_utilities: ^0.13.0
  html: ^0.15.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  fluttertoast: ^9.1.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.1.0
  animations: ^2.2.0
  android_package_installer: ^0.0.3
  android_package_manager: ^0.7.1
  share_plus: ^13.1.0
  sqflite: ^2.4.2+1
  simple_localization:
    git:
      url: https://github.com/omeritzics/simple_localization
      ref: develop
  android_intent_plus: ^6.0.0
  flutter_archive: ^6.3.0
  archive: ^4.0.9
  hsluv: ^1.1.3
  connectivity_plus: ^7.1.1
  docman: ^1.2.0
  crypto: ^3.0.7
  bcrypt: ^1.2.0
  app_links: ^7.0.1
  equations: ^6.0.0
  flex_color_picker: ^3.8.0
  android_system_font: # TODO: Forked dependency; watch upstream for releases
    git:
      url: https://github.com/re7gog/android_system_font
      ref: 077e15d7d0acb82283b89dfd82f4984b27b28f95
  shizuku_apk_installer: # TODO: Forked dependency; watch upstream for releases
    git:
      url: https://github.com/re7gog/shizuku_apk_installer
      ref: 3ef7f8fbf904848d144304556b0f80c91fee82a5
  markdown: ^7.3.1
  flutter_typeahead: ^6.0.0
  battery_plus: ^7.1.0
  flutter_charset_detector: ^6.0.0
  pubspec_parse: ^1.5.0
  m3_floating_toolbar: ^0.1.0
  dns_client: ^1.3.1
  yaml: ^3.1.3
  expressive_refresh: ^0.1.2
  flutter_markdown_plus: ^1.0.12
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  path: ^1.9.1
  m3e_buttons: ^0.0.3
  progress_indicator_m3e: ^0.1.1
  loading_indicator_m3e: ^0.1.1
  dynamic_color: ^1.8.1
  intl: any
  confetti: ^0.8.0
flutter_launcher_icons:
  android: "ic_launcher"
  adaptive_icon_background: "#ffffff"
  image_path: "assets/graphics/icon.png"
  adaptive_icon_foreground: "assets/graphics/icon-foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/graphics/
    - assets/ca/
    - LICENSE.txt

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Variable.ttf
    - family: NotoSansCJK
      fonts:
        - asset: assets/fonts/NotoSansCJK-Regular.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
