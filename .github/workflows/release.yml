name: Build and Release Qama
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: "Is this a beta release?"
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Version
        id: extract_version
        run: |
          # Extracting version from pubspec.yaml
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "beta=${{ github.event.inputs.beta }}" >> $GITHUB_OUTPUT

      - name: Generate Build Number
        run: |
          echo "BUILD_NUMBER=$(date +'%y%m%d%H%M')" >> $GITHUB_ENV

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../upload-keystore.jks" >> android/key.properties

      - name: Verify Keystore
        run: |
          ls -la android/upload-keystore.jks
          file android/upload-keystore.jks
          keytool -list -v -keystore android/upload-keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" || echo "Keystore verification failed"

      - name: Set App Name and Build APKs
        run: |
          # Removing "debug" suffix from the Updatium's name
          sed -i 's/android:label=".*"/android:label="Updatium"/g' android/app/src/main/AndroidManifest.xml
          
          flutter pub get

          # Building Normal release
          flutter build apk --flavor normal --release --obfuscate --split-debug-info=build/debug-info

          flutter build apk --flavor fdroid -t lib/main_fdroid.dart --release --obfuscate --split-debug-info=build/debug-info

      - name: Save APKs as Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: updatium-release-v${{ steps.extract_version.outputs.version }}-run${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.extract_version.outputs.tag }}
          name: "Updatium Qama ${{ steps.extract_version.outputs.version }}${{ github.event.inputs.beta == 'true' && ' (Beta)' || '' }}"
          prerelease: ${{ github.event.inputs.beta == true }}
          draft: true
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

      - name: Cleanup signing files
        if: always()
        run: |
          if [ -n "$GITHUB_WORKSPACE" ]; then
            rm -f "$GITHUB_WORKSPACE/android/upload-keystore.jks" || true
            rm -f "$GITHUB_WORKSPACE/android/key.properties" || true
            unset KEYSTORE_PASSWORD || true
            unset KEY_PASSWORD || true
            unset KEY_ALIAS || true
          fi
