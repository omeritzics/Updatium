name: Dependency Upgrade

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: '3.38.9'
          cache: true

      - name: Update GitHub Actions
        id: update-actions
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            
            // Find all workflow files
            const workflowFiles = execSync('find .github/workflows -name "*.yml" -o -name "*.yaml"').toString().trim().split('\n');
            
            let hasUpdates = false;
            let updateSummary = [];
            
            for (const file of workflowFiles) {
              if (!file) continue;
              
              console.log(`Processing ${file}`);
              let content = fs.readFileSync(file, 'utf8');
              const originalContent = content;
              
              // Find all uses: actions/...@vX patterns
              const actionPattern = /uses:\s+([a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+)@v(\d+)/g;
              let match;
              
              while ((match = actionPattern.exec(content)) !== null) {
                const [fullMatch, actionOwnerRepo, currentVersion] = match;
                const [owner, repo] = actionOwnerRepo.split('/');
                
                try {
                  // Get latest release version from GitHub API
                  const response = await github.rest.repos.getLatestRelease({
                    owner: owner,
                    repo: repo
                  });
                  
                  const latestTag = response.data.tag_name;
                  const latestVersion = latestTag.match(/v(\d+)/);
                  
                  if (latestVersion && parseInt(latestVersion[1]) > parseInt(currentVersion)) {
                    console.log(`Updating ${actionOwnerRepo} from v${currentVersion} to ${latestTag}`);
                    content = content.replace(fullMatch, fullMatch.replace(`@v${currentVersion}`, `@${latestTag}`));
                    hasUpdates = true;
                    updateSummary.push(`${actionOwnerRepo}: v${currentVersion} -> ${latestTag}`);
                  }
                } catch (error) {
                  console.log(`Could not check ${actionOwnerRepo}: ${error.message}`);
                }
              }
              
              if (content !== originalContent) {
                fs.writeFileSync(file, content);
              }
            }
            
            core.setOutput('has_action_updates', hasUpdates);
            core.setOutput('action_summary', updateSummary.join('\n'));

      - name: Install dependencies
        run: flutter pub get

      - name: Check for outdated packages
        id: outdated
        run: |
          flutter pub outdated > outdated.txt
          cat outdated.txt
          
          # Parse outdated packages and categorize by update type
          echo "package_updates=" >> $GITHUB_OUTPUT
          echo "major_updates=" >> $GITHUB_OUTPUT
          echo "minor_updates=" >> $GITHUB_OUTPUT
          echo "patch_updates=" >> $GITHUB_OUTPUT
          
          if grep -q "pub.dev packages" outdated.txt && ! grep -A 100 "pub.dev packages" outdated.txt | grep -q "All up-to-date"; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            
            # Extract package information
            awk '
              /pub.dev packages/ { in_packages=1; next }
              /Git dependencies/ { in_packages=0; next }
              in_packages && /^[a-zA-Z]/ {
                if ($1 != "Resolving") {
                  pkg = $1
                  current = $2
                  latest = $4
                  if (current != latest) {
                    print pkg ":" current "->" latest
                  }
                }
              }
            ' outdated.txt > package_list.txt
            
            if [ -s package_list.txt ]; then
              echo "package_updates<<EOF" >> $GITHUB_OUTPUT
              cat package_list.txt >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Upgrade dependencies
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          echo "Upgrading dependencies..."
          flutter pub upgrade --major-versions
          flutter pub get
          
          # Generate upgrade summary
          echo "=== Upgrade Summary ===" > upgrade_summary.txt
          if [ -f package_list.txt ]; then
            echo "Upgraded packages:" >> upgrade_summary.txt
            cat package_list.txt >> upgrade_summary.txt
          fi
          echo "=== End Summary ===" >> upgrade_summary.txt
          cat upgrade_summary.txt

      - name: Security audit
        run: |
          echo "Running security audit..."
          # Check for known security vulnerabilities
          flutter pub deps --style=tree > deps_tree.txt
          
          # Basic security checks (can be expanded)
          echo "=== Security Check Results ===" > security_report.txt
          echo "Dependencies tree generated successfully" >> security_report.txt
          echo "No automated vulnerability scanning configured" >> security_report.txt
          echo "=== End Security Report ===" >> security_report.txt

      - name: Create Pull Request
        if: steps.outdated.outputs.has_updates == 'true' || steps.update-actions.outputs.has_action_updates == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          title: 'chore: upgrade dependencies'
          body: |
            Automated dependency upgrade.
            
            ## Summary
            This PR includes automated updates for:
            
            ### Flutter/Dart Packages
            ${{ steps.outdated.outputs.package_updates }}
            
            ### GitHub Actions
            ${{ steps.update-actions.outputs.action_summary }}
            
            ## Security
            Basic security audit completed. No automated vulnerability scanning is configured.
            
            ## Notes
            - Git dependencies are not updated automatically and require manual review
            - Please review all changes before merging
            - Test thoroughly after merging
          branch: upgrade/dependencies
          commit-message: 'chore: upgrade dependencies'
          labels: dependencies, automated
          delete-branch: true
          draft: false
