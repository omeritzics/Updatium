name: CI Commit Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build_artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: '3.38.9'  # Use specific stable version that meets requirements
          cache: true

      - name: Prepare Build
        run: |
          flutter pub get
          # Strip signing config to build debug APK safely without keystores
          # Handle both .gradle and .gradle.kts files
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' android/app/build.gradle || true
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' android/app/build.gradle.kts || true
          
      - name: Build APK (Debug with ABI Splitting)
        run: |
          # Inject the short SHA into the Application ID to allow side-by-side testing
          # This replaces the existing applicationId with a unique one for this commit
          sed -i 's/applicationId = ".*"/applicationId = "com.updatium.ci.${{ steps.vars.outputs.sha_short }}"/g' android/app/build.gradle.kts || true
          
          # Build debug APKs split by ABI for smaller size (focus on 64-bit phones)
          flutter build apk --debug --flavor normal --split-per-abi
          
          mkdir -p build/outputs/artifacts/
          
          # Copy and rename split APKs (prioritize 64-bit ARM for phones)
          if [ -f "build/app/outputs/flutter-apk/app-normal-arm64-v8a-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-normal-arm64-v8a-debug.apk build/outputs/artifacts/updatium-${{ steps.vars.outputs.sha_short }}-arm64-v8a.apk
            echo "✅ ARM64-v8a (64-bit phones): $(ls -lh build/app/outputs/flutter-apk/app-normal-arm64-v8a-debug.apk | awk '{print $5}')"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-normal-armeabi-v7a-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-normal-armeabi-v7a-debug.apk build/outputs/artifacts/updatium-${{ steps.vars.outputs.sha_short }}-armeabi-v7a.apk
            echo "✅ ARM32-v7a (32-bit phones): $(ls -lh build/app/outputs/flutter-apk/app-normal-armeabi-v7a-debug.apk | awk '{print $5}')"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-normal-x86_64-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-normal-x86_64-debug.apk build/outputs/artifacts/updatium-${{ steps.vars.outputs.sha_short }}-x86_64.apk
            echo "✅ x86_64 (emulators/tablets): $(ls -lh build/app/outputs/flutter-apk/app-normal-x86_64-debug.apk | awk '{print $5}')"
          fi
          
          # Create a universal APK as fallback (will be larger but supports all devices)
          flutter build apk --debug --flavor normal
          cp build/app/outputs/flutter-apk/app-normal-debug.apk build/outputs/artifacts/updatium-${{ steps.vars.outputs.sha_short }}-universal.apk
          echo "📦 Universal (all architectures): $(ls -lh build/app/outputs/flutter-apk/app-normal-debug.apk | awk '{print $5}')"
          
          echo "\n📊 APK Size Summary:"
          echo "Primary recommendation: arm64-v8a (for modern 64-bit phones)"
          echo "Legacy support: armeabi-v7a (for older 32-bit phones)"
          echo "Testing/emulation: x86_64 (for emulators and some tablets)"
          echo "Universal: For devices that don't fit the above categories"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Updatium-Commit-${{ steps.vars.outputs.sha_short }}
          path: build/outputs/artifacts/
          retention-days: 14 # Keep artifacts for 14 days to save space

  auto_reject_on_failure:
    runs-on: ubuntu-latest
    needs: build_artifact
    if: ${{ always() && github.event_name == 'pull_request' && needs.build_artifact.result == 'failure' }}
    permissions:
      pull-requests: write
    
    steps:
      - name: Auto-Reject PR on Build Failure
        uses: actions/github-script@v7
        with:
          script: |
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,

            // Only skip if CI already requested changes
            const alreadyRejected = reviews.some(
              (review) =>
                review.user.login === 'github-actions[bot]' &&
                review.state === 'CHANGES_REQUESTED'
            );

            if (!alreadyRejected) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'REQUEST_CHANGES',
                body: '🚫 **CI Build Failed**\n\nThe automated build process failed. Please review the build logs and fix the issues before requesting another review.\n\n**Next steps:**\n1. Check the build logs for specific errors\n2. Fix the identified issues\n3. Push your fixes to this branch\n4. The CI will automatically re-run\n\nOnce the build passes, this review will be dismissed automatically.'
              });

              console.log(`Auto-rejected PR #${context.issue.number} due to build failure`);
            } else {
              console.log(`PR #${context.issue.number} already has a CI rejection review`);
            }
            }

  auto_approve_on_success:
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' && needs.build_artifact.result == 'success' && github.event.pull_request.head.repo.fork == false && contains(github.event.pull_request.labels.*.name, 'ci-auto-approve') }}
    if: ${{ always() && github.event_name == 'pull_request' && needs.build_artifact.result == 'success' && github.event.pull_request.head.repo.fork == false }}
    permissions:
      pull-requests: write
    
    steps:
      - name: Auto-Approve PR on Build Success
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            // Find and dismiss any existing CI rejection reviews
            const ciRejectionReviews = reviews.filter(
              (review) =>
                review.user.login === 'github-actions[bot]' &&
                review.state === 'CHANGES_REQUESTED'
            );

            for (const review of ciRejectionReviews) {
              await github.rest.pulls.dismissReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                review_id: review.id,
                message: '✅ **CI Build Passed** - Automatically dismissing previous rejection as the build now succeeds.'
              });
            }

            const alreadyApproved = reviews.some(
              (review) =>
                review.user.login === 'github-actions[bot]' &&
                review.state === 'APPROVED'
            );

            if (!alreadyApproved) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'APPROVE',
                body: '✅ **CI Build Passed**\n\nAutomatically approving this PR because the build succeeded.'
              });
              console.log(`Auto-approved PR #${context.issue.number} after successful build`);
            } else {
              console.log(`PR #${context.issue.number} already has a CI approval review`);
            }