name: Nightly Build

permissions:
  contents: write

on:
  push:
    branches:
      - main 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        
      - name: Auto-fix linting issues
        run: git pull && dart fix --apply

      - name: Format code
        run: dart format .

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-fix linting and formatting issues"
          branch: ${{ github.ref_name }}
          push_options: --force
          
      - name: Generate Version
        id: version
        run: |
          # Generate version: YY.M.0 format (semantic versioning)
          YEAR=$(date +'%y')
          MONTH=$(date +'%-m')
          VERSION="$YEAR.$MONTH.0"
          
          # Generate build number: YYMMDDHH format
          BUILD_NUMBER=$(date +'%y%m%d%H')
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          echo "Keystore decoded and permissions set"

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Handle non-ASCII characters properly
          cat << EOF > android/key.properties
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=../upload-keystore.jks
          EOF
          chmod 600 android/key.properties
          echo "Created keystore properties file with restricted permissions"

      - name: Verify key.properties
        run: |
          echo "=== key.properties content ==="
          cat android/key.properties
          echo "=== End of key.properties ==="
          echo "Environment variables check:"
          echo "KEYSTORE_PASSWORD length: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD != '0' }}"
          echo "KEY_PASSWORD length: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD != '0' }}"
          echo "KEY_ALIAS length: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS != '0' }}"
          echo "KEYSTORE_PASSWORD is set: ${{ secrets.KEYSTORE_PASSWORD != '' }}"
          echo "KEY_PASSWORD is set: ${{ secrets.KEY_PASSWORD != '' }}"
          echo "KEY_ALIAS is set: ${{ secrets.KEY_ALIAS != '' }}"
          echo "KEYSTORE_PASSWORD value: '${{ secrets.KEYSTORE_PASSWORD }}'"
          echo "KEY_PASSWORD value: '${{ secrets.KEY_PASSWORD }}'"
          echo "KEY_ALIAS value: '${{ secrets.KEY_ALIAS }}'"

      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ls -la android/upload-keystore.jks
          file android/upload-keystore.jks
          echo "=== Keystore contents ==="
          # Use heredoc to handle non-ASCII characters properly
          keytool -list -v -keystore android/upload-keystore.jks -storepass "${KEYSTORE_PASSWORD}" 2>/dev/null || echo "Failed to list keystore contents"
          echo "=== End keystore contents ==="
          if ! keytool -list -v -keystore android/upload-keystore.jks -storepass "${KEYSTORE_PASSWORD}" 2>/dev/null; then
            echo "ERROR: Keystore verification failed - aborting build"
            exit 1
          fi
          echo "Keystore verification successful"

      - name: Build APKs
        run: |
          flutter build apk --flavor normal --release --obfuscate --split-debug-info=build/debug-info --build-name="${{ steps.version.outputs.version }}" --build-number="${{ steps.version.outputs.build_number }}"
          flutter build apk --flavor normal --release --obfuscate --split-debug-info=build/debug-info --target-platform android-arm64 --build-name="${{ steps.version.outputs.version }}" --build-number="${{ steps.version.outputs.build_number }}"

          mkdir -p build/outputs/
          cp build/app/outputs/flutter-apk/app-normal-release.apk build/outputs/updatium-nightly-universal.apk
          cp build/app/outputs/flutter-apk/app-normal-release.apk build/outputs/updatium-nightly-arm64-v8a.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Updatium-Nightly-APK
          path: |
            build/outputs/updatium-nightly-universal.apk
            build/outputs/updatium-nightly-arm64-v8a.apk

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Updatium Nightly"
          files: |
            build/outputs/updatium-nightly-universal.apk
            build/outputs/updatium-nightly-arm64-v8a.apk
          prerelease: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup signing files
        if: always()
        run: |
          echo "Starting cleanup of sensitive signing files..."
          
          # Cleanup keystore file
          if [ -f "$GITHUB_WORKSPACE/android/upload-keystore.jks" ]; then
            rm -f "$GITHUB_WORKSPACE/android/upload-keystore.jks" || echo "WARNING: Failed to delete keystore file"
            if [ -f "$GITHUB_WORKSPACE/android/upload-keystore.jks" ]; then
              echo "ERROR: Keystore file still exists after cleanup attempt"
            else
              echo "Successfully deleted keystore file"
            fi
          else
            echo "Keystore file not found, nothing to cleanup"
          fi
          
          # Cleanup key.properties file
          if [ -f "$GITHUB_WORKSPACE/android/key.properties" ]; then
            rm -f "$GITHUB_WORKSPACE/android/key.properties" || echo "WARNING: Failed to delete key.properties file"
            if [ -f "$GITHUB_WORKSPACE/android/key.properties" ]; then
              echo "ERROR: key.properties file still exists after cleanup attempt"
            else
              echo "Successfully deleted key.properties file"
            fi
          else
            echo "key.properties file not found, nothing to cleanup"
          fi
          
          # Unset environment variables
          unset KEYSTORE_PASSWORD || echo "WARNING: Failed to unset KEYSTORE_PASSWORD"
          unset KEY_PASSWORD || echo "WARNING: Failed to unset KEY_PASSWORD"
          unset KEY_ALIAS || echo "WARNING: Failed to unset KEY_ALIAS"
          unset KEYSTORE_PASS || echo "WARNING: Failed to unset KEYSTORE_PASS"
          
          echo "Cleanup completed"
