name: Nightly Build

permissions:
  contents: write

on:
  push:
    branches:
      - main 
      - dev
      - stable
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: '3.38.9'  # Use specific stable version that meets requirements
          cache: true

      # Running sync script to ensure no broken dependencies before building
      - name: Run Environment Sync
        run: |
          if [ -f "scripts/fix_environment.sh" ]; then
            chmod +x scripts/fix_environment.sh
            ./scripts/fix_environment.sh
          else
            echo "Sync script not found, skipping..."
          fi

      - name: Generate Version
        id: version
        run: |
          # Generate version: YY.M.0 format (semantic versioning)
          YEAR=$(date +'%y')
          MONTH=$(date +'%-m')
          VERSION="$YEAR.$MONTH.0"
          
          # Generate build number: YYMMDDHH format
          BUILD_NUMBER=$(date +'%y%m%d%H')
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Build APK (Debug Mode)
        run: |
          # Removing signing configurations to prevent errors in CI
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' android/app/build.gradle* || true
          
          flutter build apk --debug --flavor normal --build-name="${{ steps.version.outputs.version }}" --build-number="${{ steps.version.outputs.build_number }}"
          
          mkdir -p build/outputs/
          cp build/app/outputs/flutter-apk/app-normal-debug.apk build/outputs/updatium-nightly.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Updatium-Nightly-APK
          path: build/outputs/updatium-nightly.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Updatium Nightly"
          files: build/outputs/updatium-nightly.apk
          prerelease: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
