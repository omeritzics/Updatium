name: Nightly Build

permissions:
  contents: write

on:
  push:
    branches:
      - main 
      - stable
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (API 35 + NDK)
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          
          # Add SDK tools to path for this step and subsequent steps
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

          yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT
          sdkmanager --update --sdk_root=$ANDROID_SDK_ROOT
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run Environment Sync
        run: |
          if [ -f "scripts/fix_environment.sh" ]; then
            chmod +x scripts/fix_environment.sh
            ./scripts/fix_environment.sh
          else
            echo "Sync script not found, skipping..."
          fi

      - name: Generate Build Number
        run: |
          # Format: YYMMDDHH (e.g., 26020315) - stays under Android's 2.1B limit
          echo "BUILD_NUMBER=$(date +'%y%m%d%H')" >> $GITHUB_ENV
          
      - name: Build APK (Debug Mode)
        run: |
          # Ensure compileSdk and targetSdk are aligned with Android SDK 35
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle.kts
          
          # Remove signing configurations to prevent errors in CI
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' android/app/build.gradle.kts || true
          
          flutter build apk --debug \
            --build-name="26.2.0-nightly" \
            --build-number=${{ env.BUILD_NUMBER }}
          
          mkdir -p build/outputs/
          cp build/app/outputs/flutter-apk/app-debug.apk build/outputs/updatium-nightly-debug.apk
            
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Updatium-Debug-APK
          path: build/outputs/updatium-nightly-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-build
          name: "Updatium Nightly"
          files: build/outputs/updatium-nightly-debug.apk
          prerelease: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
