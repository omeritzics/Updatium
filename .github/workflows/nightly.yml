name: Nightly Build

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    branches:
      - main 
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Cache Flutter dependencies
        uses: actions/cache@main
        with:
          path: |
            ~/.pub-cache
            /opt/flutter
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Cache Gradle dependencies
        uses: actions/cache@main
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Upgrade existing dependencies
        run: flutter pub upgrade --major-versions
        
      - name: Check for code changes
        id: changes
        run: |
          if git diff --quiet HEAD~1 HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        
      - name: Auto-fix linting issues
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config pull.rebase false
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull && dart fix --apply

      - name: Format code
        if: steps.changes.outputs.has_changes == 'true'
        run: dart format .

      - name: Commit and Push changes
        if: steps.changes.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: "style: auto-fix linting and formatting issues"
          branch: ${{ github.ref_name }}
          push_options: --force

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Cache Flutter dependencies
        uses: actions/cache@main
        with:
          path: |
            ~/.pub-cache
            /opt/flutter
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Cache Gradle dependencies
        uses: actions/cache@main
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Setup Java JDK
        uses: actions/setup-java@v5.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
          
      - name: Generate Version
        id: version
        run: |
          # Generate version: YY.M.0 format (semantic versioning)
          YEAR=$(date +'%y')
          MONTH=$(date +'%-m')
          VERSION="$YEAR.$MONTH.0"
          
          # Generate build number: YYMMDDHH format
          BUILD_NUMBER=$(date +'%y%m%d%H')
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Build APKs
        run: |
          mkdir -p build/outputs
          flutter build apk --flavor normal --profile --obfuscate --split-debug-info=build/debug-info --build-name="${{ steps.version.outputs.version }}" --build-number="${{ steps.version.outputs.build_number }}" --no-pub --tree-shake-icons --dart-define=flutter.web.canvaskit=false
          cp "build/app/outputs/flutter-apk/app-normal-profile.apk" "build/outputs/Updatium-Nightly.apk"
          flutter build apk --flavor normal --debug --obfuscate --split-debug-info=build/debug-info --build-name="${{ steps.version.outputs.version }}" --build-number="${{ steps.version.outputs.build_number }}" --no-pub --tree-shake-icons --dart-define=flutter.web.canvaskit=false
          cp "build/app/outputs/flutter-apk/app-normal-debug.apk" "build/outputs/Updatium-Nightly-Debug.apk"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@main
        with:
          subject-path: 'build/outputs/Updatium-Nightly*.apk'
      - name: Upload Artifacts
        uses: actions/upload-artifact@main
        with:
          name: Updatium-Nightly-APKs
          path: |
            build/outputs/Updatium-Nightly*.apk

      - name: Create Release
        if: success() && hashFiles('build/outputs/Updatium-Nightly*.apk') != ''
        uses: softprops/action-gh-release@master
        with:
          tag_name: nightly
          name: "Updatium Nightly"
          files: |
            build/outputs/Updatium-Nightly*.apk
          prerelease: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
