name: Build and Release Qama (Signed)

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # Upgraded to Java 21 to match the new Flutter/Android standards
          cache: 'gradle'

      - name: Setup Android SDK (API 35 + NDK)
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_ENV"
          
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          
          yes | sdkmanager --licenses
          sdkmanager --update
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode Keystore
        run: |
          # Reconstruct the keystore file from the Base64-encoded GitHub Secret
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks

      - name: Create key.properties
        run: |
          # Generate the properties file that Gradle uses to locate and authenticate the keystore
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      - name: Run Environment Sync
        run: |
          if [ -f "scripts/fix_environment.sh" ]; then
            chmod +x scripts/fix_environment.sh
            ./scripts/fix_environment.sh
          else
            echo "Sync script not found, skipping..."
          fi

      - name: Build Signed Release APK
        run: |
          # Align compileSdk/targetSdk with installed SDK 35 in Kotlin DSL
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle.kts

          # Update the app name in AndroidManifest
          sed -i 's/android:label=".*"/android:label="Updatium"/g' android/app/src/main/AndroidManifest.xml
          
          # Build the APK
          flutter build apk --flavor normal --release \
            --build-name="26.2" \
            --build-number="${{ github.run_number }}" \
            --obfuscate --split-debug-info=build/debug-info

          mkdir -p build/outputs/
          cp build/app/outputs/flutter-apk/app-normal-release.apk build/outputs/updatium-qama-v26.2-run${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Updatium-Qama-v26.2-run${{ github.run_number }}
          path: build/outputs/updatium-qama-v26.2-run${{ github.run_number }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qama-v26.2-run${{ github.run_number }}
          name: "Updatium Qama v26.2 (Signed - Run ${{ github.run_number }})"
          files: build/outputs/updatium-qama-v26.2-run${{ github.run_number }}.apk
          prerelease: true
          draft: true # Kept as draft for final manual verification before publishing
          body: |
            ### Updatium Qama v26.2 - Signed Release
            This build is officially signed with the release keystore.
            - **Build Number**: ${{ github.run_number }}
            - **Java Version**: 21
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup signing files
        if: always()
        run: |
          # Securely remove sensitive signing files after the build is complete
          rm -f android/app/release-keystore.jks
          rm -f android/key.properties
